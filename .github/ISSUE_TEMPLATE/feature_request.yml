name: Feature Request
description: 提出一个新功能建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 清晰简洁地描述你遇到的问题或需求
      placeholder: 我希望能够...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 描述你希望如何解决这个问题
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的任何替代解决方案

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 添加任何其他上下文或截图
